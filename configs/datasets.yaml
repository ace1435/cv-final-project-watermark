  - name: screenspot_pro
    kind: hf
    repo: likaixin/ScreenSpot-Pro
    prefix: images/
    dest: screenspot_pro
    license: MIT
    domain: screen
    category: ui_desktop
  - name: visualwebbench
    kind: hf
    repo: visualwebbench/VisualWebBench
    files:
      - web_caption/test-00000-of-00001.parquet
      - heading_ocr/test-00000-of-00001.parquet
      - webqa/test-00000-of-00001.parquet
