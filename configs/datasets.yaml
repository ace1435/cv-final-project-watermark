    license: academic research only, null set only, never published
    domain: photo
    category: div2k
  - name: screenspot_v2
    kind: hf
    repo: OS-Copilot/ScreenSpot-v2
    files:
      - screenspotv2_image.zip
      - screenspot_mobile_v2.json
      - screenspot_desktop_v2.json
      - screenspot_web_v2.json
