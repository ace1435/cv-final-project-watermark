    prefix: data/validation-
    dest: doclaynet
    license: CDLA-Permissive-1.0
    domain: screen
    category: doc_doclaynet
  - name: arxiv_cc_by
    kind: arxiv
    set: cs
    from: "2024-03-04"
    until: "2024-03-06"
    licenses:
      - http://creativecommons.org/licenses/by/4.0/
    max_candidates: 200
    dest: arxiv
    license: CC BY 4.0
    domain: screen
    category: doc_arxiv
